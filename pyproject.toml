[project]
name = "ha-njord"
version = "0.1.0"
description = "Home Assistant custom integration for njord weather service"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "st0o0" }]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component",
    "grpcio-tools>=1.60.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
# openspec/ holds planning docs (including archived proposals with illustrative,
# not-necessarily-current Python snippets in fenced code blocks) — ruff format
# treats those as real source by default, so keep it out of scan scope.
exclude = ["custom_components/njord/proto/", "openspec/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.njord"]
