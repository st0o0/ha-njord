schema: spec-driven

context: |
  ha-njord — Home Assistant custom integration for the njord weather service.
  Python package (HACS-installable) that connects to njord's gRPC API via
  streaming, creates native weather, sensor, binary_sensor, event, and button
  entities with real-time updates.

  Architecture: ha-njord is a pure consumer — reads forecasts, enrichments,
  and config via gRPC streaming (no polling on the HA side). Enrichment
  sensors (alerts, indices, trends, derived, history) are toggleable via
  options flow. Sensor push feeds indoor readings back to njord.

  Structure: `custom_components/njord/` contains the HA integration code.
  Tests in `tests/`. Proto definitions in `protos/njord/v2/`.
  Generated stubs in `custom_components/njord/proto/`.

  Tech stack: Python 3.12+, grpcio, protobuf, Home Assistant Core APIs.
  Testing: pytest with pytest-homeassistant-custom-component.
  Linting: ruff (format + check), config in pyproject.toml.

  Git: commit conventionally, NEVER `git push` — the user pushes.

rules:
  proposal:
    - "Always include a 'Non-goals' section."
    - "Note which gRPC endpoints from njord are required (existing vs new)."
  tasks:
    - "Reference concrete file paths under `custom_components/njord/` and `tests/`."
    - "Every implementation chunk includes pytest tests."
    - "Add a Validation section running `python -m pytest tests/ -v --tb=short` for the touched suites."
    - "Chunks completable in one session, ordered by dependency."
  specs:
    - "Specs describe observable HA entity behavior; name Python classes only at platform boundaries."
